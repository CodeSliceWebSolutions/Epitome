<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
	<!-- CONFIRMATION MODAL -->
	<div id="confirmModal" class="modal hidden">
		<div class="modal-content">
			<h2>Confirm Progress</h2>
			<p>Have you completed this task?</p>

			<div class="modal-actions">
			<button id="confirmYes">Yes, I completed it</button>
			<button id="confirmNo">No, not yet</button>
			</div>
		</div>
	</div>

	<div class="use-to-center">
		<div class="quest-card">

			<!--Quest Header-->
			<div>
				<i>!</i>
				<span>QUEST INFO</span>
			</div>


		</div>
	</div>
	
	<h1>Reading Progress</h1>
	<!-- LESSON CONTENT (THIS IS WHAT GETS REPLACED) -->
	<div id="lessonContent">
	</div>

	<!-- DYNAMIC MESSAGE FROM FIREBASE PROGRESS -->
	<h2 id="lessonMessage"></h2>

	<!-- PROGRESS COUNTER -->
	<h2>Times read: <span id="count">0</span></h2>

	<!-- ACTION BUTTON -->
	<button id="readBtn">I have read this</button>

	<!-- SCRIPT (MUST BE LAST) -->
  	<script type="module" src="script.js"></script>
	
</body>
</html>
